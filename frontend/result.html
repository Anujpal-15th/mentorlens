<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Result · MentorLens</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ccircle cx='14' cy='14' r='7' fill='none' stroke='white' stroke-width='2.4'/%3E%3Cpath d='M19 19l6 6' stroke='white' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
  <script type="module" src="js/result.js"></script>
</head>
<body>
  <header id="topbar" class="topbar"></header>
  <main class="page">
    <div id="banner" hidden></div>
    <section id="status" aria-live="polite"></section>

    <div id="result" hidden>
      <section class="card fade-in" id="verdict" aria-labelledby="verdict-title"></section>

      <section class="card fade-in" id="replay" aria-labelledby="replay-title" style="margin-top:18px">
        <div class="card-head">
          <div class="row">
            <h2 id="replay-title">Step-by-step replay</h2>
            <span class="pill" id="replay-mode"></span>
          </div>
          <span class="kbd-hint"><kbd>←</kbd> <kbd>→</kbd> step · <kbd>Space</kbd> play · <kbd>D</kbd> first difference</span>
        </div>
        <div id="replay-body">
          <div class="replay-toolbar" role="toolbar" aria-label="Replay controls">
            <div class="controls">
              <button class="icon-btn" type="button" id="btn-first" aria-label="First step" title="First step (Home)"></button>
              <button class="icon-btn" type="button" id="btn-back" aria-label="Previous step" title="Previous step (←)"></button>
              <button class="icon-btn" type="button" id="btn-play" aria-label="Play" title="Play or pause (Space)"></button>
              <button class="icon-btn" type="button" id="btn-next" aria-label="Next step" title="Next step (→)"></button>
              <button class="icon-btn" type="button" id="btn-last" aria-label="Last step" title="Last step (End)"></button>
            </div>
            <span class="step-counter" id="step-counter" aria-live="polite"></span>
            <label class="sr-only" for="speed">Playback speed</label>
            <select class="speed" id="speed">
              <option value="1400">0.5×</option>
              <option value="750" selected>1×</option>
              <option value="380">2×</option>
              <option value="180">4×</option>
            </select>
            <span class="toolbar-spacer"></span>
            <button class="btn btn-sm" type="button" id="btn-jump"></button>
          </div>
          <div class="timeline">
            <label class="sr-only" for="scrubber">Step</label>
            <input type="range" id="scrubber" min="0" max="0" value="0" step="1">
            <div class="diff-marker" id="diff-marker" data-label="first difference" hidden></div>
          </div>
          <div class="timeline-scale"><span id="scale-start">1</span><span id="scale-end"></span></div>
          <div id="replay-notes"></div>
          <div class="panes" id="panes"></div>
        </div>
      </section>

      <div class="result-grid">
        <section class="card fade-in" id="mentor" aria-labelledby="mentor-title"></section>
        <aside class="card fade-in" id="quality" aria-labelledby="quality-title"></aside>
      </div>
    </div>
  </main>
</body>
</html>
